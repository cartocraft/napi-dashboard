<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <title>नापी कार्यालय उदयपुर</title>
  <link rel="stylesheet" href="style.css">

  <!-- Nepali Date -->
  <script src="https://cdn.jsdelivr.net/npm/nepali-date-converter/dist/nepali-date-converter.min.js"></script>
</head>
<body>

<header class="header">

  <img src="assets/nepal-flag.gif" class="flag" />

  <div class="title">
    <h1>नापी कार्यालय उदयपुर</h1>
    <div id="datetime">Loading...</div>
  </div>

  <img src="assets/Emblem_of_Nepal.png" class="logo" />

</header>

<div class="grid">

  <!-- Progress -->
  <div class="card">
    <h2>आजको प्रगतिः</h2>
    <p>कित्ताकाट - ६</p>
    <p>नक्सा प्रिन्ट - २३</p>
    <p>क्षेत्रफल जाँच - २</p>
    <p>फिल्ड रेखांकन - २</p>
    <p>कित्ता एकिकरण - १</p>
    <p>राजश्व संकलन - रु २४,०८९</p>
  </div>

  <!-- Map -->
  <div class="card">
    <h2>उदयपुर जिल्ला नक्सा</h2>
  <div class="map-container">
    <img src="assets/udaypur.jpg"
         class="map-img"
         onerror="this.style.display='none'; document.getElementById('map-placeholder').style.display='flex';">

    <div id="map-placeholder" class="placeholder">
      <span>नक्सा उपलब्ध छैन</span>
  </div>

  <!-- Queue -->
  <div class="card">
    <h2>Queue</h2>
    <div id="current">A-102</div>
    <div>Next: <span id="next">A-103</span></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
