<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <title>नापी कार्यालय उदयपुर</title>
  <link rel="stylesheet" href="style.css">

  <!-- Nepali Date -->
  <script src="https://cdn.jsdelivr.net/npm/nepali-date-converter/dist/nepali-date-converter.min.js"></script>
</head>
<body>

<header class="header">

  <div class="flag-container">
    <img src="assets/nepal-flag.gif" class="flag" />
  </div>

  <div class="title">
    <h1>नापी कार्यालय उदयपुर</h1>
    <div id="datetime"></div>
  </div>

  <div class="logo-container">
    <img src="assets/Emblem_of_Nepal.png" class="logo" />
  </div>

</header>

<div class="grid">

  <!-- Progress -->
  <div class="card progress">
    <h2>आजको प्रगतिः</h2>
    <p>कित्ताकाट - ६</p>
    <p>नक्सा प्रिन्ट - २३</p>
    <p>क्षेत्रफल जाँच - २</p>
    <p>फिल्ड रेखांकन - २</p>
    <p>कित्ता एकिकरण - १</p>
    <p>राजश्व संकलन - रु २४,०८९</p>
  </div>

  <!-- JPG Map -->
  <div class="card map">
    <h2>उदयपुर जिल्ला नक्सा</h2>
    <img src="assets/Udaypur-map.jpg" class="map-img" />
  </div>

  <!-- Queue -->
  <div class="card queue">
    <h2>Queue</h2>
    <div id="current">A-102</div>
    <div>Next: <span id="next">A-103</span></div>
  </div>

  <!-- Notice -->
  <div class="card notice">
    <marquee>
      कृपया आवश्यक कागजात लिएर आउनुहोस् | सेवा समय: १०-५
    </marquee>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
