<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <title>नापी कार्यालय उदयपुर</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

  <img src="assets/nepal-flag.gif" class="flag" />

  <div class="title">
  <h1>नापी कार्यालय उदयपुर</h1>

  <!-- Hamro Patro Embed -->
  <iframe 
    src="https://www.hamropatro.com/widgets/calender-small.php"
    class="hamro-date"
    frameborder="0">
  </iframe>

</div>

  <img src="assets/Emblem_of_Nepal.png" class="logo" />

</header>

<div class="grid">

  <!-- Progress -->
  <div class="card">
    <h2>आजको प्रगतिः</h2>
    <p>कित्ताकाट - ६</p>
    <p>नक्सा प्रिन्ट - २३</p>
    <p>क्षेत्रफल जाँच - २</p>
    <p>फिल्ड रेखांकन - २</p>
    <p>कित्ता एकिकरण - १</p>
    <p>राजश्व संकलन - रु २४,०८९</p>
  </div>

  <!-- Map -->
  <div class="card">
    <h2>उदयपुर जिल्ला नक्सा</h2>

    <div class="map-container">
      <img src="assets/Udaypur-map.jpg" class="map-img"
           onerror="this.style.display='none'; document.getElementById('placeholder').style.display='flex';">

      <div id="placeholder" class="placeholder">
        नक्सा उपलब्ध छैन
      </div>
    </div>

  </div>

  <!-- Queue -->
  <div class="card">
    <h2>Queue</h2>
    <div id="current">A-102</div>
    <div>Next: <span id="next">A-103</span></div>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
